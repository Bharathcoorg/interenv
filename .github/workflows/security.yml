name: Security Audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 6 AM
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          arguments: --all-features --hide-incompliant
      - name: cargo outdated
        uses: kubouch/cargo-outdated-action@v1.0.0
