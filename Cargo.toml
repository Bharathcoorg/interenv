[package]
name = "interenv"
version = "0.1.0"
edition = "2021"
authors = ["Bharath B R <bharathcoorg7@gmail.com>"]
description = "Hardware-Enclave Protected Secrets for Terminal & Git (Zero Plaintext .env on Disk) by Interlayer"
license = "MIT"
repository = "https://github.com/Bharathcoorg/interenv"
rust-version = "1.75"
keywords = ["secrets", "env", "security", "enclave", "cli"]
categories = ["command-line-utilities", "development-tools", "cryptography"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
keyring = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
colored = "2.1"
dialoguer = "0.11"
thiserror = "1.0"
tempfile = "3.10"
hex = "0.4"
dunce = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "interenv"
path = "src/main.rs"

[lib]
name = "interenv"
path = "src/lib.rs"
