[package]
name = "interenv"
version = "0.1.0"
edition = "2021"
authors = ["Bharath B R <bharathcoorg7@gmail.com>"]
description = "Hardware-Enclave Protected Secrets for Terminal & Git (Zero Plaintext .env on Disk) by Interlayer"
license = "MIT"
repository = "https://github.com/Bharathcoorg/interenv"
rust-version = "1.75"
keywords = ["secrets", "env", "security", "enclave", "cli"]
categories = ["command-line-utilities", "development-tools", "cryptography"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
chacha20poly1305 = "=0.10.1"
aes-gcm = "=0.10.3"
aead = "=0.5.2"
argon2 = "=0.5.3"
rand = "=0.8.5"
zeroize = { version = "=1.8.1", features = ["derive"] }
keyring = "=2.3.3"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
sha2 = "=0.10.8"
colored = "=2.1.0"
dialoguer = "=0.11.0"
thiserror = "=1.0.69"
tempfile = "=3.16.0"
hex = "=0.4.3"
chrono = { version = "=0.4.39", features = ["serde"] }
ctrlc = "=3.4.5"
regex = "=1.11.1"
atty = "=0.2.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Memory",
] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.169"
signal-hook = "=0.3.17"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "=0.5.0"
nix = { version = "=0.29.0", features = ["fs", "ioctl"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.2.0"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unexpected_cfgs = "warn"

[[bin]]
name = "interenv"
path = "src/main.rs"

[lib]
name = "interenv"
path = "src/lib.rs"
