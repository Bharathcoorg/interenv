[package]
name = "interenv"
version = "1.0.0"
edition = "2021"
authors = ["Bharath B R <bharathcoorg7@gmail.com>"]
description = "Hardware-Enclave Protected Secrets for Terminal, AI Agents & Git (Zero Plaintext .env) - Modern Dotenv Alternative with TPM & Secure Enclave by Interlayer"
license = "MIT"
repository = "https://github.com/Bharathcoorg/interenv"
rust-version = "1.75"
keywords = ["secrets", "dotenv", "security", "enclave", "tpm"]
categories = ["command-line-utilities", "development-tools", "cryptography"]

[workspace]
members = ["."]
exclude = ["fuzz"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
chacha20poly1305 = "=0.10.1"
aead = "=0.5.2"
argon2 = "=0.5.3"
rand = "=0.8.5"
zeroize = { version = "=1.8.1", features = ["derive"] }
keyring = "=2.3.3"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
sha2 = "=0.10.8"
colored = "=2.1.0"
dialoguer = "=0.11.0"
thiserror = "=1.0.69"
tempfile = "=3.16.0"
hex = "=0.4.3"
chrono = { version = "=0.4.39", features = ["serde"] }
ctrlc = "=3.4.5"
regex = "=1.11.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Memory",
] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.169"
signal-hook = "=0.3.17"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "=0.5.0"
nix = { version = "=0.29.0", features = ["fs", "ioctl"] }
tss-esapi = { version = "=7.7.0", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.2.0"

[dev-dependencies]
proptest = "1"
criterion = { version = "=0.5.1", features = ["html_reports"] }

[features]
default = []
tpm = ["dep:tss-esapi"]
unsafe_mode = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
debug = false
incremental = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unexpected_cfgs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
uninlined_format_args = "allow"
ptr_as_ptr = "allow"
borrow_as_ptr = "allow"
unnecessary_wraps = "allow"
similar_names = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
items_after_statements = "allow"
needless_pass_by_value = "allow"
manual_let_else = "allow"
redundant_closure_for_method_calls = "allow"
single_match_else = "allow"
match_same_arms = "allow"
used_underscore_binding = "allow"
ptr_cast_constness = "allow"
ignored_unit_patterns = "allow"
format_push_string = "allow"
explicit_iter_loop = "allow"
bool_to_int_with_if = "allow"
case_sensitive_file_extension_comparisons = "allow"
map_unwrap_or = "allow"
redundant_else = "allow"

[[bin]]
name = "interenv"
path = "src/main.rs"

[lib]
name = "interenv"
path = "src/lib.rs"

[[bench]]
name = "crypto"
harness = false
