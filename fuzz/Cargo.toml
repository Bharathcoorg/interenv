[package]
name = "interenv-fuzz"
version = "0.1.0"
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.7"
hex = "=0.4.3"

[dependencies.interenv]
path = ".."

[[bin]]
name = "parse_dotenv"
path = "fuzz_targets/parse_dotenv.rs"
test = false
doc = false

[[bin]]
name = "decrypt_payload"
path = "fuzz_targets/decrypt_payload.rs"
test = false
doc = false

[[bin]]
name = "kdf_input"
path = "fuzz_targets/kdf_input.rs"
test = false
doc = false
